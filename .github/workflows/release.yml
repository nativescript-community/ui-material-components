name: 'release'

on:
  workflow_dispatch:
    inputs:
      release_type:
        type: choice
        default: auto
        description: What kind of version upgrade
        options: 
        - auto
        - patch
        - minor
        - major

jobs:
  release:
    permissions:
      contents: write
      id-token: write
    # macOS builds iOS native libraries; a plugin that does not need it can set the repository variable RELEASE_RUNNER (e.g. ubuntu-latest)
    runs-on: ${{ vars.RELEASE_RUNNER || 'macos-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: "0"
          submodules: true

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Update npm (trusted publishing needs npm >= 11.5.1)
        run: npm install -g npm@latest


      - uses: oNaiPs/secrets-to-env-action@v1
        with:
          secrets: ${{ toJSON(secrets) }}
      

      - uses: oleksiyrudenko/gha-git-credentials@v2-latest
        with:
          token: '${{ secrets.GITHUB_TOKEN }}'
          name: Martin Guillon
          email: dev@akylas.fr
      
      - name: install jq
        run: command -v jq > /dev/null || sudo apt-get install -y jq || brew install jq
      
      - name: Enable CorePack
        run: |
          corepack enable 
          yarn config get globalFolder # the yarn command will ensure the correct yarn version is downloaded and installed

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "::set-output name=dir::$(yarn config get globalFolder)"

      - name: Remove package.json resolutions
        run: |
          cp package.json "$RUNNER_TEMP/package.json"
          cp yarn.lock "$RUNNER_TEMP/yarn.lock"
          echo "`jq 'delpaths([["resolutions"]])' package.json`" > package.json

      - uses: actions/cache@v4
        name: Handle node_modules Cache
        id: yarn-node_modules # use this to check for `cache-hit` (`steps.yarn-cache.outputs.cache-hit != 'true'`)
        with:
          path: node_modules
          key: ${{ runner.os }}-yarn-node_modules-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node_modules-

      - uses: actions/cache@v4
        if: steps.yarn-node_modules.outputs.cache-hit != 'true'
        name: Handle Yarn cache
        id: yarn-cache # use this to check for `cache-hit` (`steps.yarn-cache.outputs.cache-hit != 'true'`)
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-cache-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install deps
        if: steps.yarn-node_modules.outputs.cache-hit != 'true'
        uses: bahmutov/npm-install@v1
        with:
          install-command: corepack yarn --silent
        env: 
          YARN_ENABLE_IMMUTABLE_INSTALLS: false

      # lerna-lite >= 5.7 refuses to publish from a dirty working tree
      - name: Restore package.json and yarn.lock
        run: |
          cp "$RUNNER_TEMP/package.json" package.json
          cp "$RUNNER_TEMP/yarn.lock" yarn.lock

      - name: run setup
        run: |
          npm run setup

      - name: "NPM Identity (token fallback)"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" >> "$HOME/.npmrc"
          else
            echo "NPM_TOKEN not set, using npm trusted publishing (OIDC)"
          fi

      - name: publish auto
        if: github.event.inputs.release_type == 'auto'
        run: |
          npm run publish -- --force-publish --no-verify-access --no-private --no-commit-hooks --yes
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: publish
        if: github.event.inputs.release_type != 'auto'
        run: |
          npm run publish -- --force-publish --no-verify-access --no-private --no-commit-hooks --yes --bump ${{ github.event.inputs.release_type }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}